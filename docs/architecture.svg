<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SampleProject Architecture</text>

  <!-- Left column: Stack &amp; Queue Library -->
  <rect x="40" y="60" width="320" height="260" fill="#e8f4f8" stroke="#333" stroke-width="2" rx="8"/>
  <text x="200" y="90" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">libdatastructures</text>

  <rect x="60" y="120" width="110" height="50" fill="#d4edda" stroke="#333" stroke-width="1" rx="4"/>
  <text x="115" y="150" font-family="monospace" font-size="12" text-anchor="middle">stack.h</text>

  <rect x="60" y="190" width="110" height="50" fill="#d4edda" stroke="#333" stroke-width="1" rx="4"/>
  <text x="115" y="220" font-family="monospace" font-size="12" text-anchor="middle">stack.c</text>

  <rect x="220" y="120" width="110" height="50" fill="#fff3cd" stroke="#333" stroke-width="1" rx="4"/>
  <text x="275" y="150" font-family="monospace" font-size="12" text-anchor="middle">queue.h</text>

  <rect x="220" y="190" width="110" height="50" fill="#fff3cd" stroke="#333" stroke-width="1" rx="4"/>
  <text x="275" y="220" font-family="monospace" font-size="12" text-anchor="middle">queue.c</text>

  <rect x="60" y="270" width="110" height="40" fill="#f8d7da" stroke="#333" stroke-width="1" rx="4"/>
  <text x="115" y="295" font-family="monospace" font-size="11" text-anchor="middle">libdatastructures.a</text>

  <rect x="220" y="270" width="110" height="40" fill="#f8d7da" stroke="#333" stroke-width="1" rx="4"/>
  <text x="275" y="295" font-family="monospace" font-size="11" text-anchor="middle">libdatastructures.so</text>

  <rect x="110" y="360" width="180" height="50" fill="#cce5ff" stroke="#333" stroke-width="2" rx="4"/>
  <text x="200" y="390" font-family="monospace" font-size="12" text-anchor="middle">stack_queue_app.c</text>

  <rect x="110" y="440" width="180" height="40" fill="#e2e3e5" stroke="#333" stroke-width="1" rx="4"/>
  <text x="200" y="465" font-family="monospace" font-size="11" text-anchor="middle">test_stack_queue_app.sh</text>

  <!-- Right column: WebRTC Streaming Module -->
  <rect x="440" y="60" width="480" height="340" fill="#f0e6ff" stroke="#333" stroke-width="2" rx="8"/>
  <text x="680" y="90" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">WebRTC Streaming Demo (KAN-8)</text>

  <rect x="470" y="110" width="150" height="50" fill="#d4edda" stroke="#333" stroke-width="1" rx="4"/>
  <text x="545" y="140" font-family="monospace" font-size="12" text-anchor="middle">webrtc_stream.h</text>

  <rect x="470" y="180" width="150" height="50" fill="#d4edda" stroke="#333" stroke-width="1" rx="4"/>
  <text x="545" y="210" font-family="monospace" font-size="12" text-anchor="middle">webrtc_stream.c</text>

  <!-- GStreamer WebRTC deps -->
  <rect x="660" y="110" width="240" height="50" fill="#e8f4f8" stroke="#333" stroke-width="1" rx="4"/>
  <text x="780" y="130" font-family="monospace" font-size="10" text-anchor="middle">GStreamer: webrtcbin</text>
  <text x="780" y="150" font-family="monospace" font-size="10" text-anchor="middle">libsoup / json-glib</text>

  <!-- Modes -->
  <rect x="470" y="250" width="180" height="40" fill="#cce5ff" stroke="#333" stroke-width="1" rx="4"/>
  <text x="560" y="275" font-family="monospace" font-size="11" text-anchor="middle">GStreamer RTP Mode</text>

  <rect x="680" y="250" width="220" height="40" fill="#fff3cd" stroke="#333" stroke-width="1" rx="4"/>
  <text x="790" y="275" font-family="monospace" font-size="11" text-anchor="middle">DataChannel Mode</text>

  <!-- Media sources -->
  <rect x="470" y="310" width="120" height="40" fill="#d1ecf1" stroke="#333" stroke-width="1" rx="4"/>
  <text x="530" y="335" font-family="monospace" font-size="11" text-anchor="middle">v4l2src (cam)</text>

  <rect x="610" y="310" width="130" height="40" fill="#d1ecf1" stroke="#333" stroke-width="1" rx="4"/>
  <text x="675" y="335" font-family="monospace" font-size="11" text-anchor="middle">filesrc (MP4)</text>

  <rect x="760" y="310" width="140" height="40" fill="#d1ecf1" stroke="#333" stroke-width="1" rx="4"/>
  <text x="830" y="335" font-family="monospace" font-size="11" text-anchor="middle">H.264 / x264enc</text>

  <!-- Browser client -->
  <rect x="470" y="440" width="200" height="50" fill="#cce5ff" stroke="#333" stroke-width="2" rx="4"/>
  <text x="570" y="470" font-family="monospace" font-size="12" text-anchor="middle">webrtc_client.html</text>

  <!-- Test -->
  <rect x="700" y="440" width="200" height="50" fill="#e2e3e5" stroke="#333" stroke-width="1" rx="4"/>
  <text x="800" y="470" font-family="monospace" font-size="11" text-anchor="middle">test_webrtc_stream.sh</text>

  <!-- Signaling label -->
  <text x="570" y="425" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">WebSocket Signaling (STUN: stun.l.google.com)</text>

  <!-- Arrows: Stack/Queue -->
  <line x1="115" y1="170" x2="115" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="170" x2="275" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="115" y1="240" x2="115" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="240" x2="275" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="310" x2="200" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="410" x2="200" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: WebRTC -->
  <line x1="545" y1="160" x2="545" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="230" x2="560" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="230" x2="790" y2="250" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="560" y1="290" x2="530" y2="310" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="560" y1="290" x2="675" y2="310" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="675" y1="350" x2="830" y2="310" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="400" x2="570" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="400" x2="800" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- GStreamer App (existing) -->
  <rect x="110" y="510" width="180" height="40" fill="#e2e3e5" stroke="#333" stroke-width="1" rx="4"/>
  <text x="200" y="535" font-family="monospace" font-size="11" text-anchor="middle">gstreamer_app.c</text>

  <text x="480" y="595" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">
    Build flow: headers define APIs; sources compile; libraries link; applications run; tests validate.
  </text>
</svg>
